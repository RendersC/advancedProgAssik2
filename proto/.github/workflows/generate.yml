name: Generate Protobuf Code

on:
  push:
    branches: [main]
    paths:
      - '**/*.proto'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout proto repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.0'
          include-pre-releases: false

      - name: Install protoc-gen-go and protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate Go code
        run: |
          mkdir -p gen/payment gen/order
          protoc \
            --proto_path=. \
            --go_out=gen \
            --go_opt=paths=source_relative \
            --go-grpc_out=gen \
            --go-grpc_opt=paths=source_relative \
            payment/payment.proto order/order.proto

      - name: Checkout generated code repository
        uses: actions/checkout@v4
        with:
          repository: RendersC/ap2-gen
          path: ap2-generated
          token: ${{ secrets.GENERATED_REPO_TOKEN }}

      - name: Copy generated files & push
        run: |
          cp -r gen/payment/* ap2-generated/payment/
          cp -r gen/order/*   ap2-generated/order/
          cd ap2-generated
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: regenerate protobuf code [skip ci]"
          git push
